name: Update rent reports
# Aggregates anonymous rent reports (Google Form → published CSV) every 6 hours.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_reports.py
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing to publish (form not set up yet, or no new reports): stop quietly
          [ -n "$(git status --porcelain -- site/data/reports.json)" ] || { echo "No changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/reports.json
          git commit -m "Data: rent reports"
          git push
          gh workflow run pages.yml --ref main
